name: Genergy UM staging tests

on:
  # schedule:
    # Daily 02:15 Asia/Karachi (21:15 UTC the previous day).
  #   - cron: '15 21 * * *'
  workflow_dispatch:
    inputs:
      spec:
        description: 'Optional path/glob under cypress/e2e/ (include the prefix)'
        type: string
      tags:
        description: 'Optional grep tags separated by spaces or commas'
        type: string
      send_report_email:
        description: 'Email the HTML report'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: genergy-staging-cypress
  cancel-in-progress: false

jobs:
  cypress-run:
    runs-on: ${{ vars.CYPRESS_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 300
    env:
      TZ: UTC
      NODE_OPTIONS: --max-old-space-size=4096
      DB_SSL: 'true'
      DB_TLS_REJECT_UNAUTHORIZED: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Validate and write private staging configs
        id: staging-config
        env:
          USER_CONFIG_JSON: ${{ secrets.GENERGY_STAGING_USERS }}
          DB_CONFIG_JSON: ${{ secrets.GENERGY_STAGING_DB_CONFIG }}
        run: |
          node <<'NODE'
          const required = [
            ['USER_CONFIG_JSON', 'repository secret GENERGY_STAGING_USERS'],
            ['DB_CONFIG_JSON', 'repository secret GENERGY_STAGING_DB_CONFIG'],
          ];
          const missing = required.filter(([key]) => !process.env[key]?.trim());
          if (missing.length) {
            console.error('Missing GitHub Actions settings: ' + missing.map(([, setting]) => setting).join(', '));
            process.exit(1);
          }

          let db;
          try {
            db = JSON.parse(process.env.DB_CONFIG_JSON)?.staging?.db;
          } catch {
            console.error('GENERGY_STAGING_DB_CONFIG must contain valid JSON. See cypress/config/dbConfig.example.json.');
            process.exit(1);
          }
          const missingFields = ['host', 'user', 'password'].filter(key => typeof db?.[key] !== 'string' || !db[key].trim());
          if (missingFields.length) {
            console.error('GENERGY_STAGING_DB_CONFIG is missing staging.db fields: ' + missingFields.join(', '));
            process.exit(1);
          }

          let userConfig;
          try {
            userConfig = JSON.parse(process.env.USER_CONFIG_JSON);
          } catch {
            console.error('GENERGY_STAGING_USERS must contain valid user.json JSON.');
            process.exit(1);
          }
          const { defaultUser, users } = userConfig ?? {};
          const user = typeof defaultUser === 'string' && users && Object.hasOwn(users, defaultUser)
            ? users[defaultUser] : null;
          if (typeof user?.email !== 'string' || !user.email.trim() || typeof user.password !== 'string' || !user.password) {
            console.error('GENERGY_STAGING_USERS needs a default user with an email and password.');
            process.exit(1);
          }
          NODE
          umask 077
          printf '%s\n' "$DB_CONFIG_JSON" > cypress/config/dbConfig.local.json
          printf '%s\n' "$USER_CONFIG_JSON" > cypress/config/user.json

      - name: Run Cypress in Chrome
        id: tests
        shell: bash
        env:
          SPEC: ${{ inputs.spec }}
          TAGS: ${{ inputs.tags }}
        run: |
          args=()
          if [[ -n "$SPEC" ]]; then
            if [[ "$SPEC" != cypress/e2e/* || "$SPEC" == *..* || "$SPEC" == *$'\n'* || "$SPEC" == *$'\r'* ]]; then
              echo 'Use a spec path or glob under cypress/e2e/.'
              exit 1
            fi
            args+=(--spec "$SPEC")
          fi
          export GREP_TAGS="${TAGS//,/ }"
          npm test -- "${args[@]}"

      - name: Clean up staging fixtures
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: npm run cleanup:all

      - name: Remove temporary staging configs
        if: ${{ always() && steps.staging-config.outcome != 'skipped' && steps.staging-config.outcome != '' }}
        run: rm -f cypress/config/dbConfig.local.json cypress/config/user.json

      - name: Upload Cypress artifacts
        id: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genergy-um-report-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
            .qa-runs/
          include-hidden-files: true
          retention-days: 14

      - name: Email the report
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.send_report_email) && hashFiles('cypress/reports/html/*.html') != '' }}
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ vars.SMTP_HOST || 'email-smtp.us-east-1.amazonaws.com' }}
          server_port: 587
          secure: false
          require_tls: true
          username: ${{ vars.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ vars.SENDER }}
          to: ${{ vars.RECEIVERS }}
          subject: 'Genergy Cypress #${{ github.run_number }} — ${{ job.status }}'
          body: 'Cypress staging run: ${{ steps.artifacts.outputs.artifact-url }}'
          attachments: cypress/reports/html/*.html
