name: Genergy UM staging tests

on:
  schedule:
    # Daily 02:15 Asia/Karachi (21:15 UTC the previous day).
    - cron: '15 21 * * *'
  workflow_dispatch:
    inputs:
      spec:
        description: 'Optional path/glob under cypress/e2e/ (include the prefix)'
        type: string
      tags:
        description: 'Optional grep tags separated by spaces or commas'
        type: string
      send_report_email:
        description: 'Email the HTML report'
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: genergy-staging-cypress
  cancel-in-progress: false

jobs:
  cypress-run:
    runs-on: ${{ vars.CYPRESS_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 300
    env:
      TZ: UTC
      NODE_OPTIONS: --max-old-space-size=4096
      UM_EMAIL: ${{ vars.UM_EMAIL }}
      UM_PASSWORD: ${{ secrets.UM_PASSWORD }}
      DB_SSL: 'true'
      DB_TLS_REJECT_UNAUTHORIZED: 'true'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Write staging DB config
        id: db-config
        env:
          DB_CONFIG_JSON: ${{ secrets.GENERGY_STAGING_DB_CONFIG }}
        run: |
          node -e 'try {
            if (!JSON.parse(process.env.DB_CONFIG_JSON).staging?.db) throw new Error();
          } catch { console.error("Set GENERGY_STAGING_DB_CONFIG using dbConfig.example.json."); process.exit(1); }'
          umask 077
          printf '%s\n' "$DB_CONFIG_JSON" > cypress/config/dbConfig.local.json

      - name: Run Cypress in Chrome
        id: tests
        shell: bash
        env:
          SPEC: ${{ inputs.spec }}
          TAGS: ${{ inputs.tags }}
        run: |
          args=()
          if [[ -n "$SPEC" ]]; then
            if [[ "$SPEC" != cypress/e2e/* || "$SPEC" == *..* || "$SPEC" == *$'\n'* || "$SPEC" == *$'\r'* ]]; then
              echo 'Use a spec path or glob under cypress/e2e/.'
              exit 1
            fi
            args+=(--spec "$SPEC")
          fi
          export GREP_TAGS="${TAGS//,/ }"
          npm test -- "${args[@]}"

      - name: Clean up staging fixtures
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        run: npm run cleanup:all

      - name: Remove temporary DB config
        if: ${{ always() && steps.db-config.outcome == 'success' }}
        run: rm -f cypress/config/dbConfig.local.json

      - name: Upload Cypress artifacts
        id: artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genergy-um-report-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            cypress/reports/
            cypress/screenshots/
            cypress/videos/
            .qa-runs/
          include-hidden-files: true
          retention-days: 14

      - name: Email the report
        if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.send_report_email) && hashFiles('cypress/reports/html/*.html') != '' }}
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ vars.SMTP_HOST || 'email-smtp.us-east-1.amazonaws.com' }}
          server_port: 587
          secure: false
          require_tls: true
          username: ${{ vars.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ vars.SENDER }}
          to: ${{ vars.RECEIVERS }}
          subject: 'Genergy Cypress #${{ github.run_number }} — ${{ job.status }}'
          body: 'Cypress staging run: ${{ steps.artifacts.outputs.artifact-url }}'
          attachments: cypress/reports/html/*.html
